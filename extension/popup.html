<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

    h1 { font-size: 14px; margin: 0 0 8px; }
    #host { font-weight: 600; word-break: break-all; }

    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
